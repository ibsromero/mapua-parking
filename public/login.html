<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapúa Parking System - Login</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { background: var(--maroon-dark); }
  .login-card { width: 420px; background: #fff; border-radius: 10px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid rgba(0,0,0,0.06); }
  .login-card h1 { text-align: center; font-size: 24px; margin: 16px 0 4px; }
  .login-card p.sub { text-align: center; color: var(--text-muted); margin: 0 0 24px; font-size: 14px; }
  .login-logo { display: block; margin: 0 auto; width: 64px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); }
  .checkbox-row input { width: auto; }
</style>
</head>
<body>
<div class="center-page">
  <div class="login-card">
    <img src="/images/mapua-logo.png" alt="Mapúa University" class="brand-logo-lg">
    <h1>Mapúa Parking System</h1>
    <p class="sub">Enter your credentials to manage your reservations</p>

    <form id="loginForm">
      <div class="field">
        <label for="id_number">Student / Faculty ID</label>
        <input id="id_number" name="id_number" placeholder="e.g. 2021105432" autocomplete="username" required maxlength="20" />
      </div>
      <div class="field">
        <div class="row-between">
          <label for="password" style="margin:0;">Password</label>
          <a href="#" style="font-size:13px;">Forgot Password?</a>
        </div>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required maxlength="200" />
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="remember" /> <label for="remember" style="margin:0;text-transform:none;font-weight:400;">Remember me on this device</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      <p id="loginError" class="error-text" style="display:none;"></p>
    </form>

    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);">
      New student or employee? <a href="/signup.html">Create an account</a>
    </div>
    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);">
      Demo student: <code>2021105432</code> / <code>student123</code><br/>
      Demo admin: <code>ADMIN-0001</code> / <code>admin123</code>
    </p>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
