<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#8c1d40" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" href="/images/mapua.png" />
<title>Sign Up - Mapúa Parking</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .signup-card { width: 460px; }
  .signup-card h1 { text-align: center; font-size: 22px; margin: 16px 0 4px; }
  .signup-card p.sub { text-align: center; color: var(--text-muted); margin: 0 0 24px; font-size: 14px; }
</style>
</head>
<body class="auth-page">
<div class="center-page">
  <div class="auth-card signup-card">
    <img src="/images/mapua-logo.png" alt="Mapúa University" class="brand-logo-lg">
    <h1>Create your account</h1>
    <p class="sub">For Mapúa students, faculty, and staff only</p>

    <form id="signupForm">
      <div class="field">
        <label for="applicant_type">You are a</label>
        <select id="applicant_type" required>
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
          <option value="non_teaching">Non-Teaching Staff</option>
        </select>
      </div>
      <div class="field">
        <label for="full_name">Full Name</label>
        <input id="full_name" placeholder="Last Name, First Name, M.I." required maxlength="150" />
      </div>
      <div class="field">
        <label for="id_number">Student / Faculty ID</label>
        <input id="id_number" placeholder="e.g. 2021105432" required maxlength="20" autocomplete="username" />
      </div>
      <div class="grid-2">
        <div class="field course-year-fields">
          <div>
            <label for="course">Course (if student)</label>
            <select id="course">
              <option value="">Select your course</option>
              <optgroup label="Architecture and Design">
                <option>BS Architecture</option>
                <option>BS Interior Design</option>
                <option>BA Multimedia Arts and Design</option>
              </optgroup>
              <optgroup label="Engineering">
                <option>BS Chemical Engineering</option>
                <option>BS Civil Engineering</option>
                <option>BS Computer Engineering</option>
                <option>BS Electrical Engineering</option>
                <option>BS Electronics Engineering</option>
                <option>BS Environmental and Sanitary Engineering</option>
                <option>BS Industrial Engineering</option>
                <option>BS Manufacturing Engineering</option>
                <option>BS Materials Engineering</option>
                <option>BS Mechanical Engineering</option>
                <option>BS Mechatronics Engineering</option>
              </optgroup>
              <optgroup label="Computing and Information Technology">
                <option>BS Computer Science</option>
                <option>BS Data Science</option>
                <option>BS Entertainment and Multimedia Computing</option>
                <option>BS Information Technology</option>
              </optgroup>
              <optgroup label="Business and Management">
                <option>BS Accountancy</option>
                <option>BS Business Administration</option>
                <option>BS Management Engineering</option>
              </optgroup>
              <optgroup label="Sciences and Social Sciences">
                <option>BS Biology</option>
                <option>BS Psychology</option>
              </optgroup>
              <option>Other Mapúa program</option>
            </select>
          </div>
          <div>
            <label for="year_level">Year level (if student)</label>
            <select id="year_level">
              <option value="">Select your year</option>
              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
              <option>5th Year</option>
            </select>
          </div>
        </div>
        <div class="field"><label for="contact_no">Contact No.</label><input id="contact_no" placeholder="09XX-XXX-XXXX" maxlength="30" /></div>
      </div>
      <div class="field">
        <label for="email">Mapúa Email Address</label>
        <input id="email" type="email" placeholder="you@mymail.mapua.edu.ph" maxlength="150" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" required minlength="8" maxlength="200" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create Account</button>
      <p id="signupError" class="error-text" style="display:none;"></p>
    </form>

    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);">
      Already have an account? <a href="/login.html">Log in</a>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
