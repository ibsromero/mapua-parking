<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sticker Applications - Admin</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .filter-tabs { display:flex; gap:8px; }
  .filter-tabs .btn.active { background:var(--maroon); color:#fff; border-color:var(--maroon); }
</style>
</head>
<body>
<div class="navbar">
  <a class="brand brand-with-logo" href="/admin/dashboard.html"><img src="/images/mapua-logo.png" alt="Mapúa University" class="brand-logo"><span class="brand-tagline">Parking</span> <span class="admin-tag">Admin</span></a>
  <nav>
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/applications.html" class="active">App Reviews</a>
    <a href="/admin/facilities.html">Facilities</a>
    <a href="/admin/support.html">Support</a>
  </nav>
  <div><a href="#" data-logout class="btn">Logout</a></div>
</div>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h1>Sticker Applications</h1>
      <p class="muted">Review and manage pending vehicle sticker requests.</p>
    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="btn active" data-status="">All</button>
      <button class="btn" data-status="pending">Pending</button>
      <button class="btn" data-status="approved">Approved</button>
      <button class="btn" data-status="rejected">Rejected</button>
    </div>
  </div>

  <div class="card table-card" style="margin-top:20px;padding:0;">
    <table>
      <thead><tr><th>Applicant</th><th>ID Number</th><th>Type</th><th>Vehicle</th><th>Plate No.</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="appRows"><tr><td colspan="7" class="muted">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin-applications.js"></script>
</body>
</html>
