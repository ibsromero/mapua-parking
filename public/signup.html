<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - Mapúa Parking</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { background: var(--maroon-dark); }
  .signup-card { width: 460px; background: #fff; border-radius: 10px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid rgba(0,0,0,0.06); }
  .signup-card h1 { text-align: center; font-size: 22px; margin: 16px 0 4px; }
  .signup-card p.sub { text-align: center; color: var(--text-muted); margin: 0 0 24px; font-size: 14px; }
</style>
</head>
<body>
<div class="center-page">
  <div class="signup-card">
    <img src="/images/mapua-logo.png" alt="Mapúa University" class="brand-logo-lg">
    <h1>Create your account</h1>
    <p class="sub">For Mapúa students, faculty, and staff only</p>

    <form id="signupForm">
      <div class="field">
        <label for="applicant_type">You are a</label>
        <select id="applicant_type" required>
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
          <option value="non_teaching">Non-Teaching Staff</option>
        </select>
      </div>
      <div class="field">
        <label for="full_name">Full Name</label>
        <input id="full_name" placeholder="Last Name, First Name, M.I." required maxlength="150" />
      </div>
      <div class="field">
        <label for="id_number">Student / Faculty ID</label>
        <input id="id_number" placeholder="e.g. 2021105432" required maxlength="20" autocomplete="username" />
      </div>
      <div class="grid-2">
        <div class="field"><label for="course_year">Course & Year (if student)</label><input id="course_year" placeholder="e.g. BSCS - 3rd Year" maxlength="100" /></div>
        <div class="field"><label for="contact_no">Contact No.</label><input id="contact_no" placeholder="09XX-XXX-XXXX" maxlength="30" /></div>
      </div>
      <div class="field">
        <label for="email">Mapúa Email Address</label>
        <input id="email" type="email" placeholder="you@mymail.mapua.edu.ph" maxlength="150" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" required minlength="8" maxlength="200" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create Account</button>
      <p id="signupError" class="error-text" style="display:none;"></p>
    </form>

    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);">
      Already have an account? <a href="/login.html">Log in</a>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
