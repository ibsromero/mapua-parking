<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support - Mapúa Parking</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="navbar">
  <a class="brand" href="/dashboard.html">Mapúa Parking</a>
  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/reservations.html">Reservations</a>
    <a href="/history.html">History</a>
    <a href="/support.html" class="active">Support</a>
  </nav>
  <div><a href="#" data-logout class="btn">Logout</a></div>
</div>

<div class="container" style="max-width:700px;">
  <h1>Support</h1>
  <p class="muted">Ran into an issue? Submit a ticket and we'll take a look.</p>

  <div class="card" style="margin-bottom:24px;">
    <form id="ticketForm">
      <div class="field">
        <label>Category</label>
        <select id="category" required>
          <option value="Sticker Issue">Sticker Issue</option>
          <option value="Booking Error">Booking Error</option>
          <option value="Payment Issue">Payment Issue</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="description" rows="4" maxlength="1000" placeholder="Describe your issue…"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Ticket</button>
      <p id="ticketError" class="error-text" style="display:none;"></p>
    </form>
  </div>

  <h3>Your Tickets</h3>
  <div id="ticketList"><p class="muted">Loading…</p></div>
</div>

<script src="/js/common.js"></script>
<script src="/js/support.js"></script>
</body>
</html>
