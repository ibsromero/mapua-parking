<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sticker Applications — Admin</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .filter-tabs { display:flex; gap:8px; }
  .filter-tabs .btn.active { background:var(--maroon); color:#fff; border-color:var(--maroon); }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🅿️ Admin<br/><span style="font-size:12px;font-weight:400;color:var(--text-muted);">Management Portal</span></div>
  <nav>
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/applications.html" class="active">App Reviews</a>
    <a href="/admin/facilities.html">Facilities</a>
    <a href="/admin/support.html">Support</a>
  </nav>
  <div style="margin-top:40px;">
    <a href="#" onclick="logout(); return false;" style="display:block;padding:12px 20px;color:var(--text);text-decoration:none;font-weight:600;font-size:14px;">Logout</a>
  </div>
</div>

<div class="admin-layout">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h1>Sticker Applications</h1>
      <p class="muted">Review and manage pending vehicle sticker requests.</p>
    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="btn active" data-status="">All</button>
      <button class="btn" data-status="pending">Pending</button>
      <button class="btn" data-status="approved">Approved</button>
      <button class="btn" data-status="rejected">Rejected</button>
    </div>
  </div>

  <div class="card" style="margin-top:20px;padding:0;overflow:hidden;">
    <table>
      <thead><tr><th>Applicant</th><th>ID Number</th><th>Type</th><th>Vehicle</th><th>Plate No.</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="appRows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
function badgeClass(status) {
  return { pending: 'badge-pending', approved: 'badge-approved', rejected: 'badge-rejected' }[status] || 'badge-pending';
}

async function loadApps(status) {
  const rowsEl = document.getElementById('appRows');
  rowsEl.innerHTML = '<tr><td colspan="7" class="muted">Loading…</td></tr>';
  const qs = status ? `?status=${encodeURIComponent(status)}` : '';
  const { applications } = await api('/api/applications' + qs);
  if (!applications.length) {
    rowsEl.innerHTML = '<tr><td colspan="7" class="muted">No applications found.</td></tr>';
    return;
  }
  rowsEl.innerHTML = applications.map(a => `
    <tr>
      <td>${esc(a.applicant_name)}</td>
      <td>${esc(a.id_number)}</td>
      <td>${esc((a.applicant_type || '').replace('_', '-'))}</td>
      <td>${esc(a.make || '')} ${esc(a.model || '')}</td>
      <td>${esc(a.plate_no || '—')}</td>
      <td><span class="badge ${badgeClass(a.status)}">${esc(a.status)}</span></td>
      <td>
        ${a.status === 'pending' ? `
          <button class="btn" style="padding:6px 10px;font-size:12px;" onclick="decide(${a.id}, 'rejected')">Reject</button>
          <button class="btn btn-primary" style="padding:6px 10px;font-size:12px;" onclick="decide(${a.id}, 'approved')">Approve</button>
        ` : '<span class="muted" style="font-size:12px;">Reviewed</span>'}
      </td>
    </tr>`).join('');
}

async function decide(id, decision) {
  if (!confirm(`Mark this application as ${decision}?`)) return;
  try {
    await api(`/api/applications/${id}/decision`, { method: 'POST', body: JSON.stringify({ decision }) });
    const active = document.querySelector('#filterTabs .btn.active').dataset.status;
    loadApps(active);
  } catch (e) {
    alert(e.message);
  }
}

document.getElementById('filterTabs').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filterTabs .btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  loadApps(e.target.dataset.status);
});

(async function () {
  const user = await requireAuth('admin');
  if (!user) return;
  loadApps('');
})();
</script>
</body>
</html>
