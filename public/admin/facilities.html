<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facilities — Admin</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .lot-tabs { display:flex; gap:8px; margin-bottom:20px; }
  .lot-tab { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600; }
  .lot-tab.active { background:var(--maroon); color:#fff; border-color:var(--maroon); }
  .slot-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .slot-mini { border-radius:8px; padding:14px; text-align:center; font-weight:700; cursor:pointer; }
  .slot-mini.available { background:#e7f6ec; color:var(--green); border:1px solid #bfe8cc; }
  .slot-mini.reserved { background:var(--maroon-light); color:var(--maroon); border:1px solid #f7c6cc; }
  .slot-mini.occupied { background:#e5e7eb; color:#4b5563; border:1px solid #d1d5db; }
  .slot-mini.maintenance { background:#fef3c7; color:var(--amber); border:1px solid #fde68a; }
  .slot-mini.picked { outline:2px solid var(--maroon); }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🅿️ Admin<br/><span style="font-size:12px;font-weight:400;color:var(--text-muted);">Management Portal</span></div>
  <nav>
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/applications.html">App Reviews</a>
    <a href="/admin/facilities.html" class="active">Facilities</a>
    <a href="/admin/support.html">Support</a>
  </nav>
  <div style="margin-top:40px;">
    <a href="#" onclick="logout(); return false;" style="display:block;padding:12px 20px;color:var(--text);text-decoration:none;font-weight:600;font-size:14px;">Logout</a>
  </div>
</div>

<div class="admin-layout" style="display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start;">
  <div class="card">
    <h1 style="font-size:20px;">Parking Slot Control</h1>
    <p class="muted">Manage and monitor real-time parking allocation.</p>
    <div class="lot-tabs" id="lotTabs"></div>
    <div class="slot-grid" id="slotGrid"><p class="muted">Loading…</p></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;" id="detailTitle">Slot Details</h3>
    <div id="detailBody"><p class="muted">Select a slot to view details.</p></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
let lots = [];
let currentLotId = null;
let currentSlots = [];

async function loadLots() {
  const { lots: l } = await api('/api/lots');
  lots = l;
  const tabs = document.getElementById('lotTabs');
  tabs.innerHTML = lots.map((lot, i) => `<div class="lot-tab ${i === 0 ? 'active' : ''}" data-id="${lot.id}">${esc(lot.name)}</div>`).join('');
  tabs.querySelectorAll('.lot-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.querySelectorAll('.lot-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      loadSlots(tab.dataset.id);
    });
  });
  if (lots[0]) loadSlots(lots[0].id);
}

async function loadSlots(lotId) {
  currentLotId = lotId;
  const grid = document.getElementById('slotGrid');
  grid.innerHTML = '<p class="muted">Loading…</p>';
  const { slots } = await api(`/api/admin/slots/${lotId}`);
  currentSlots = slots;
  grid.innerHTML = slots.map(s => `<div class="slot-mini ${s.status}" data-id="${s.id}">${esc(s.slot_number)}<br/><span style="font-size:11px;font-weight:400;text-transform:capitalize;">${esc(s.status)}</span></div>`).join('');
  grid.querySelectorAll('.slot-mini').forEach(el => {
    el.addEventListener('click', () => {
      grid.querySelectorAll('.slot-mini').forEach(s => s.classList.remove('picked'));
      el.classList.add('picked');
      showDetail(currentSlots.find(s => String(s.id) === el.dataset.id));
    });
  });
}

function showDetail(slot) {
  document.getElementById('detailTitle').textContent = `Slot ${slot.slot_number} Details`;
  const body = document.getElementById('detailBody');
  let occupant = '<p class="muted">No active occupant.</p>';
  if (slot.occupant_name) {
    occupant = `
      <p><strong>${esc(slot.occupant_name)}</strong><br/><span class="muted">${esc(slot.applicant_type || '')}</span></p>
      <p>License Plate: <strong>${esc(slot.plate_no || '—')}</strong><br/>
      Make/Model: ${esc(slot.make || '')} ${esc(slot.model || '')}<br/>
      Color: ${esc(slot.color || '—')}</p>
      <p>Time Window: ${esc((slot.start_time||'').slice(0,5))} - ${esc((slot.end_time||'').slice(0,5))}, ${esc(slot.reservation_date ? slot.reservation_date.slice(0,10) : '')}</p>`;
  }
  body.innerHTML = `
    <span class="badge badge-${slot.status}">${esc(slot.status)}</span>
    <div style="margin:16px 0;">${occupant}</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" onclick="setStatus(${slot.id}, 'available')">Mark Available</button>
      <button class="btn" onclick="setStatus(${slot.id}, 'maintenance')">Block for Maintenance</button>
    </div>`;
}

async function setStatus(slotId, status) {
  try {
    await api(`/api/admin/slots/${slotId}/status`, { method: 'POST', body: JSON.stringify({ status }) });
    loadSlots(currentLotId);
  } catch (e) {
    alert(e.message);
  }
}

(async function () {
  const user = await requireAuth('admin');
  if (!user) return;
  loadLots();
})();
</script>
</body>
</html>
