<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - Mapúa Parking</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="navbar">
  <a class="brand brand-with-logo" href="/admin/dashboard.html"><img src="/images/mapua-logo.png" alt="Mapúa University" class="brand-logo"><span class="brand-tagline">Parking</span> <span class="admin-tag">Admin</span></a>
  <nav>
    <a href="/admin/dashboard.html" class="active">Dashboard</a>
    <a href="/admin/applications.html">App Reviews</a>
    <a href="/admin/facilities.html">Facilities</a>
    <a href="/admin/support.html">Support</a>
  </nav>
  <div><a href="#" data-logout class="btn">Logout</a></div>
</div>

<div class="container">
  <h1>Dashboard Overview</h1>
  <p class="muted">Mapúa University - Main Campus Parking Status</p>

  <div class="grid-3" style="margin:24px 0;">
    <div class="card stat-card">
      <h3>Total Occupancy</h3>
      <div class="value" id="occPct">-</div>
      <p class="muted" id="occDetail" style="margin:4px 0 0;font-size:13px;"></p>
    </div>
    <div class="card stat-card">
      <h3>Active Reservations</h3>
      <div class="value" id="activeCount">-</div>
    </div>
    <div class="card stat-card">
      <h3>Pending Applications</h3>
      <div class="value" id="pendingCount">-</div>
      <a href="/admin/applications.html" style="font-size:13px;">Review All →</a>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Recent Activity</h3>
    <div id="recentActivity"><p class="muted">Loading...</p></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin-dashboard.js"></script>
</body>
</html>
