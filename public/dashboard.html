<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - Mapúa Parking</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="navbar">
  <a class="brand brand-with-logo" href="/dashboard.html"><img src="/images/mapua-logo.png" alt="Mapúa University" class="brand-logo"><span class="brand-tagline">Parking</span></a>
  <nav>
    <a href="/dashboard.html" class="active">Dashboard</a>
    <a href="/reservations.html">Reservations</a>
    <a href="/history.html">History</a>
    <a href="/support.html">Support</a>
  </nav>
  <div>
    <a href="#" data-logout class="btn">Logout</a>
  </div>
</div>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h1 id="welcome" style="margin-bottom:4px;">Welcome back</h1>
      <p class="muted">Here is your parking status for today.</p>
    </div>
    <a href="/reservations.html" class="btn btn-primary">+ Book a Slot</a>
  </div>

  <div id="stickerBanner"></div>

  <div class="grid-2">
    <div class="card">
      <h3 style="margin-top:0;">Active Reservation</h3>
      <div id="activeReservation"><p class="muted">Loading…</p></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Real-time Occupancy</h3>
      <div id="occupancy"><p class="muted">Loading…</p></div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
