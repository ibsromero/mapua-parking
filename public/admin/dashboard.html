<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - Mapúa Parking</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="navbar">
  <a class="brand brand-with-logo" href="/admin/dashboard.html"><img src="/images/mapua-logo.png" alt="Mapúa University" class="brand-logo"><span class="brand-tagline">Parking</span> <span class="admin-tag">Admin</span></a>
  <nav>
    <a href="/admin/dashboard.html" class="active">Dashboard</a>
    <a href="/admin/applications.html">App Reviews</a>
    <a href="/admin/facilities.html">Facilities</a>
    <a href="/admin/support.html">Support</a>
    <a href="/admin/guards.html">Guards</a>
  </nav>
  <div><a href="#" data-logout class="btn">Logout</a></div>
</div>

<div class="container">
  <h1>Dashboard Overview</h1>
  <p class="muted">Mapúa University - Main Campus Parking Status</p>

  <div class="stat-bar" style="margin:20px 0;">
    <div class="stat-bar-item">
      <span class="stat-bar-label">Total Occupancy</span>
      <span class="stat-bar-value" id="occPct">-</span>
      <span class="stat-bar-detail" id="occDetail"></span>
    </div>
    <div class="stat-bar-item">
      <span class="stat-bar-label">Active Reservations</span>
      <span class="stat-bar-value" id="activeCount">-</span>
    </div>
    <div class="stat-bar-item">
      <span class="stat-bar-label">Pending Applications</span>
      <span class="stat-bar-value" id="pendingCount">-</span>
      <a href="/admin/applications.html" style="font-size:12px;">Review all →</a>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Recent Activity</h3>
    <div id="recentActivity"><p class="muted">Loading...</p></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/admin-dashboard.js"></script>
</body>
</html>
